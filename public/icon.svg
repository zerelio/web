<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
  </defs>

  <!-- Topology / knowledge graph: 4 connected nodes -->
  <!-- Connector lines -->
  <line x1="16" y1="16" x2="32" y2="16" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="32" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="16" x2="32" y2="32" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="16" y1="32" x2="32" y2="32" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Nodes -->
  <circle cx="16" cy="16" r="5" fill="url(#g)"/>
  <circle cx="32" cy="16" r="5" fill="url(#g)"/>
  <circle cx="16" cy="32" r="5" fill="url(#g)"/>
  <circle cx="32" cy="32" r="5" fill="url(#g)"/>

  <!-- Inner highlight on each node -->
  <circle cx="16" cy="16" r="2" fill="#0f0f1a" opacity="0.3"/>
  <circle cx="32" cy="16" r="2" fill="#0f0f1a" opacity="0.3"/>
  <circle cx="16" cy="32" r="2" fill="#0f0f1a" opacity="0.3"/>
  <circle cx="32" cy="32" r="2" fill="#0f0f1a" opacity="0.3"/>
</svg>
